# CD: every push to main deploys the server (landing, web, admin, API, TURN, face, storage).
# GitHub SSHes into the server and runs infra/deploy.sh there.
# One-time setup (keys + secrets): infra/CICD.md
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:          # these don't change anything on the server
      - "app/**"           # Flutter app ships through the stores
      - "docs/**"
      - "**/*.md"
      - "notes.txt"
  workflow_dispatch:       # "Run workflow" button in the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never kill a deploy halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # optional: add required reviewers under Settings → Environments
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30"
          # Ship this commit's deploy.sh and run it for exactly this commit.
          scp -i ~/.ssh/deploy_key -o BatchMode=yes infra/deploy.sh "$TARGET:/tmp/vibe-deploy.sh"
          $SSH "$TARGET" "bash /tmp/vibe-deploy.sh $GITHUB_SHA"

      - name: Check public URLs
        run: |
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"); echo "$code  $1"; [[ "$code" =~ ^(200|30[1278])$ ]]; }
          ok=1
          check https://api.vibe.fawadiqbal.dev/health/live || ok=0
          check https://vibe.fawadiqbal.dev                  || ok=0
          check https://app.vibe.fawadiqbal.dev              || ok=0
          check https://admin.vibe.fawadiqbal.dev            || ok=0
          [ "$ok" = 1 ]

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check TURN relay (calls across networks)
        run: |
          export TURN_URLS="$(sed -n 's/^TURN_URLS=//p' infra/.env.prod | tr -d '\r')"
          export TURN_SECRET="$(sed -n 's/^TURN_SECRET=//p' infra/.env.prod | tr -d '\r')"
          export STUN_URLS='stun:stun.l.google.com:19302'
          echo "::add-mask::$TURN_SECRET"
          node backend/scripts/turn-check.mjs

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
