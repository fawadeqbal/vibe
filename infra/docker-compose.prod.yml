# Vibe Production Stack
# Completely isolated from KCP. Shares only the global-proxy network for routing.
services:
  vibe-postgres:
    image: postgres:16-alpine
    container_name: vibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${VIBE_DB_PASSWORD}
      POSTGRES_DB: vibe
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vibe-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe"]
      interval: 5s
      retries: 10

  vibe-redis:
    image: redis:7-alpine
    container_name: vibe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - vibe-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Self-hosted S3 (Garage) for photos and selfies. Private network only: the
  # API is its one client and serves public photos at https://<api>/media/...
  vibe-storage:
    image: dxflrs/garage:v2.4.1
    container_name: vibe-storage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - storage-meta:/var/lib/garage/meta
      - storage-data:/var/lib/garage/data
    networks:
      - vibe-internal
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Face checks for selfie verification: face match + pose-challenge liveness
  # (face/README.md). Private network only; the API is its one client.
  vibe-face:
    build:
      context: ./face
    container_name: vibe-face
    restart: unless-stopped
    mem_limit: 768m
    networks:
      - vibe-internal
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # One-shot, idempotent: node layout, buckets, and the API's access key.
  vibe-storage-init:
    image: node:22-alpine
    container_name: vibe-storage-init
    restart: "no"
    command: ["node", "/init.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://vibe-storage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
    volumes:
      - ./infra/garage/init.mjs:/init.mjs:ro
    depends_on:
      vibe-storage: { condition: service_started }
    networks:
      - vibe-internal

  # API → https://api.vibe.fawadiqbal.dev (port 3000; also serves /media)
  vibe-api:
    build:
      context: ./backend
    container_name: vibe-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vibe:${VIBE_DB_PASSWORD}@vibe-postgres:5432/vibe?schema=public
      REDIS_URL: redis://vibe-redis:6379
      UPLOAD_DIR: /app/uploads
    volumes:
      # Media stored on disk before the switch to vibe-storage (still served at
      # /media as a fallback), and the local driver's files if it is used again.
      - uploads:/app/uploads
      - uploads-private:/app/uploads-private
    depends_on:
      vibe-postgres: { condition: service_healthy }
      vibe-redis: { condition: service_healthy }
      vibe-storage-init: { condition: service_completed_successfully }
    networks:
      vibe-internal: {}
      global-proxy:

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Admin panel → https://admin.vibe.fawadiqbal.dev (port 3001)
  vibe-admin:
    build:
      context: ./admin
    container_name: vibe-admin
    restart: unless-stopped
    environment:
      VIBE_API_URL: http://vibe-api:3000
      NODE_ENV: production
    depends_on:
      vibe-api: { condition: service_healthy }
    networks:
      vibe-internal: {}
      global-proxy:

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5

  # Web app → https://app.vibe.fawadiqbal.dev (port 3002). NEXT_PUBLIC_* are
  # baked in at build time, so they're build args (values from .env).
  vibe-web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_VIBE_API: ${PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${WEB_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_DEV_SIGN_IN: "false"
    container_name: vibe-web
    restart: unless-stopped
    depends_on:
      vibe-api: { condition: service_healthy }
    networks:
      global-proxy:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Landing page → https://vibe.fawadiqbal.dev (static files on nginx, port 3003)
  vibe-landing:
    build:
      context: ./landing
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_WEB_APP_URL: ${WEB_APP_URL}
        NEXT_PUBLIC_VIBE_API: ${PUBLIC_URL}
        NEXT_PUBLIC_ANDROID_URL: ${ANDROID_URL:-}
        # SEO / brand (see landing/SEO.md). Rename or move = change these + rebuild.
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-Vibe}
        NEXT_PUBLIC_BRAND_LEGAL_NAME: ${BRAND_LEGAL_NAME:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
        NEXT_PUBLIC_SOCIAL_LINKS: ${SOCIAL_LINKS:-}
        NEXT_PUBLIC_TWITTER_HANDLE: ${TWITTER_HANDLE:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    container_name: vibe-landing
    restart: unless-stopped
    networks:
      global-proxy:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # TURN relay → turn.vibe.fawadiqbal.dev (host network: 3478, 5349, relay ports)
  vibe-turn:
    image: coturn/coturn:4.18-alpine
    container_name: vibe-turn
    restart: unless-stopped
    network_mode: host
    env_file: .env
    entrypoint: ["sh", "/etc/coturn/start.sh"]
    volumes:
      - ./infra/turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./infra/turn/start.sh:/etc/coturn/start.sh:ro
      - ./infra/turn/certs:/etc/coturn/certs:ro
    tmpfs:
      - /var/lib/coturn
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  vibe-internal:
    driver: bridge
  global-proxy:
    external: true

volumes:
  pgdata:
  redisdata:
  uploads:
  uploads-private:
  storage-meta:
  storage-data:
