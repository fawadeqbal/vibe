# coturn settings for Vibe. The secret, domain, ports and certificate are
# added by start.sh from turn/.env — don't put the secret in this file.
#
# How auth works: the Vibe API hands each signed-in user a short-lived
# username/password made from TURN_SECRET (coturn "REST API" scheme, see
# backend/src/modules/matching/rtc.controller.ts). coturn checks it with the
# same secret, so no user list is stored here.

# ── Listening ──────────────────────────────────────────────────────────────
# 3478 = plain TURN over UDP and TCP. The TLS port (turns:) comes from
# TURN_TLS_PORT in .env (5349, or 443 to get through strict firewalls).
listening-port=3478

# ── Auth ───────────────────────────────────────────────────────────────────
use-auth-secret
fingerprint
# Nonces expire after 10 minutes (clients re-authenticate automatically).
stale-nonce=600

# ── TLS ────────────────────────────────────────────────────────────────────
# coturn 4.18 already refuses TLS 1.0/1.1 (minimum TLS 1.2) — nothing to set.

# ── Limits (abuse protection) ──────────────────────────────────────────────
# One call opens 1–3 relays per person (one per TURN address it tries).
user-quota=12
# Cap each relay at ~4 Mbit/s each way (value is bytes per second).
# 720p video needs ~1.5–2.5 Mbit/s, so calls are unaffected.
max-bps=500000

# ── Security ───────────────────────────────────────────────────────────────
# Relays may only reach public internet addresses, never this server's own
# network (stops people using the relay to poke at private services).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# (coturn 4.18: the admin console and the version attribute are off by default.)

# ── Logging ────────────────────────────────────────────────────────────────
log-file=stdout
simple-log
pidfile=/var/tmp/turnserver.pid
