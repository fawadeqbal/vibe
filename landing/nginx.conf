server {
  listen 3003;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Behind the reverse proxy: keep redirects relative (no :3003 / container name).
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /img/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  # The share card is written without an extension.
  location = /opengraph-image {
    default_type image/png;
    try_files $uri =404;
  }
  # Invite links from the app and web (vibe.fawadiqbal.dev/i/<code>) open the
  # landing page with the code kept in the URL.
  location ~ ^/i/([A-Za-z0-9_-]+)/?$ {
    return 302 /?invite=$1;
  }
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;
}
