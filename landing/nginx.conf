server {
  listen 3003;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Behind the reverse proxy: keep redirects relative (no :3003 / container name).
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml application/rss+xml application/manifest+json;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /img/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  # Share cards (every page has one) are written without an extension.
  # `expires` (not add_header) so the server-level security headers still apply.
  location ~ /opengraph-image$ {
    default_type image/png;
    expires 1d;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types { }
    expires 1d;
    try_files $uri =404;
  }
  location ~ ^/(llms\.txt|robots\.txt|sitemap\.xml|blog/feed\.xml)$ {
    charset utf-8;
    expires 1h;
    try_files $uri =404;
  }
  location ~ ^/(favicon\.ico|icon\.svg|apple-icon\.png|icons/) {
    expires 7d;
    try_files $uri =404;
  }
  # Invite links from the app and web (vibe.fawadiqbal.dev/i/<code>) open the
  # landing page with the code kept in the URL.
  location ~ ^/i/([A-Za-z0-9_-]+)/?$ {
    return 302 /?invite=$1;
  }
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;
}
